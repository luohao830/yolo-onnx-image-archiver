services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yolo_platform_backend
    restart: unless-stopped
    shm_size: "2gb"
    volumes:
      - ./models:/data/models
      - ./runtime:/app/runtime
      - ./webui:/app/webui
    environment:
      - MODELS_DIR=/data/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    expose:
      - "8000"

  user-app:
    build:
      context: ./frontend/user-app
      dockerfile: Dockerfile
    container_name: yolo_platform_user_app
    restart: unless-stopped
    expose:
      - "80"

  admin-app:
    build:
      context: ./frontend/admin-app
      dockerfile: Dockerfile
    container_name: yolo_platform_admin_app
    restart: unless-stopped
    expose:
      - "80"

  gateway:
    image: nginx:1.27-alpine
    container_name: yolo_platform_gateway
    restart: unless-stopped
    depends_on:
      - backend
      - user-app
      - admin-app
    ports:
      - "58000:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
