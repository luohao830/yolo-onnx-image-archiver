services:
  webui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yolo_webui
    restart: unless-stopped
    shm_size: "2gb"
    volumes:
      # 修改这里的左侧为宿主机存放图片的实际绝对路径；通过 IMAGES_HOST_DIR 变量统一控制，
      # WebUI 会基于它做“宿主机绝对路径→容器内 /data/images”换算。
      # 未设置 IMAGES_HOST_DIR 时回退到 /tmp/yolo_images 以便开箱测试，请生产环境务必覆盖。
      - ${IMAGES_HOST_DIR:-/tmp/yolo_images}:/data/images
      - ./models:/data/models
      - ./webui:/app/webui
    environment:
      - IMAGES_DIR=/data/images
      - HOST_IMAGES_DIR=${IMAGES_HOST_DIR:-/tmp/yolo_images}
      - MODELS_DIR=/data/models
      - TZ=Asia/Shanghai
    deploy:
      resources:
        reservations:
          devices:
            # 默认仅挂载 GPU 0。如需启用任务级双 GPU 分流，把 device_ids 改为 ["0","1"]。
            - driver: nvidia
              device_ids: ["0"]
              capabilities:
                - gpu
    ports:
      - "7860:7860"
