services:
  app:
    build: .
    container_name: yolo_onnx_webui
    restart: unless-stopped
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    ports:
      - "57860:7860"
    volumes:
      - ./images:/data/images
      - ./models:/data/models
      - ./webui:/app/webui
    environment:
      - IMAGES_DIR=/data/images
      - MODELS_DIR=/data/models
