version: '3.8'

services:
  app:
    build:
      context: .
      args:
        HTTP_PROXY: http://192.168.11.151:7890
        HTTPS_PROXY: http://192.168.11.151:7890
    container_name: image_tagger
    restart: always

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]

    ports:
      - "57860:7860"

    volumes:
      - ./images:/data/images
      - ./models:/data/models
      - ./data:/data/state
      - ./exports:/data/exports

    environment:
      - LC_ALL=C.UTF-8
      - LANG=C.UTF-8
      - GRADIO_SERVER_NAME=0.0.0.0
      - no_proxy=localhost,127.0.0.1

