version: "3.8"

services:
  infer:
    build: .
    container_name: yolo_onnx_infer_link
    restart: unless-stopped
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["2"]
              capabilities: [gpu]
    volumes:
      - ./images:/data/images
      - ./models:/data/models
    # 默认保持容器常驻，方便 `docker compose exec infer bash` 进入后手动执行推理命令
    entrypoint: ["bash", "-lc"]
    command: ["sleep infinity"]
